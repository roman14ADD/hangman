<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hangman — Виселица</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app">
        <header class="header">
    <svg class="hangman-svg" viewBox="0 0 200 200" width="200" height="200">
        <line x1="20" y1="180" x2="180" y2="180" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        <line x1="60" y1="180" x2="60" y2="20" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        <line x1="60" y1="20" x2="140" y2="20" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        <line x1="140" y1="20" x2="140" y2="50" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        <circle id="hangman-0" cx="140" cy="70" r="20" stroke="currentColor" stroke-width="2" fill="none" class="hangman-part hidden"/>
        <line id="hangman-1" x1="140" y1="90" x2="140" y2="130" stroke="currentColor" stroke-width="2" stroke-linecap="round" class="hangman-part hidden"/>
        <line id="hangman-2" x1="140" y1="100" x2="110" y2="120" stroke="currentColor" stroke-width="2" stroke-linecap="round" class="hangman-part hidden"/>
        <line id="hangman-3" x1="140" y1="100" x2="170" y2="120" stroke="currentColor" stroke-width="2" stroke-linecap="round" class="hangman-part hidden"/>
        <line id="hangman-4" x1="140" y1="130" x2="110" y2="160" stroke="currentColor" stroke-width="2" stroke-linecap="round" class="hangman-part hidden"/>
        <line id="hangman-5" x1="140" y1="130" x2="170" y2="160" stroke="currentColor" stroke-width="2" stroke-linecap="round" class="hangman-part hidden"/>
    </svg>

                    </header>

        <main class="game">
            <div class="hangman-card">
                <div class="lives">
                    <span class="life-dot" data-index="0"></span>
                    <span class="life-dot" data-index="1"></span>
                    <span class="life-dot" data-index="2"></span>
                    <span class="life-dot" data-index="3"></span>
                    <span class="life-dot" data-index="4"></span>
                    <span class="life-dot" data-index="5"></span>
                </div>
                <div id="wordDisplay" class="word-display"></div>
                <div id="errorCount" class="error-count">Ошибки: 0 из 6</div>
            </div>
        </main>

        <div id="modalOverlay" class="modal-overlay" aria-hidden="true">
            <div class="modal" role="dialog" aria-modal="true">
                <h2 id="modalTitle"></h2>
                <p id="modalSubtitle"></p>
                <p id="modalWord"></p>
                <button id="modalPlayAgain" class="btn-primary">Играть снова</button>
            </div>
        </div>
    </div>

    <div id="screamer" class="screamer hidden">
        <img src="screamer.jpg" alt="screamer">
    </div>

    <div id="thankYou" class="thank-you hidden">You saved me, thank you!</div>

    <input type="text" id="keyboardInput" autocapitalize="none" autocomplete="off" autocorrect="off" spellcheck="false" maxlength="1">

    <script src="script.js"></script>
</body>
</html>
